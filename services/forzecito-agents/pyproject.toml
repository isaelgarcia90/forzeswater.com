[project]
name = "forzecito-agents"
version = "0.1.0"
description = "Backend de agentes de Forzecito (Forzes Water): FastAPI + Google ADK + Gemini"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]==2.15.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
